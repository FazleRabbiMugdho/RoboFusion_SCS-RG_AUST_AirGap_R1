name: Build

on:
  push:
  pull_request:

jobs:
  backend-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robofusion
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/robofusion
      JWT_SECRET_KEY: test-jwt-secret
      ZONE_API_KEY_SALT: test-salt
      ADMIN_SEED_USERNAME: test-admin
      ADMIN_SEED_PASSWORD: test-password
      USE_LOCAL_STUB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt --break-system-packages
      - run: ruff check backend/
      - run: alembic -c backend/alembic.ini upgrade head
      - run: pytest backend/tests -v --maxfail=1

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend