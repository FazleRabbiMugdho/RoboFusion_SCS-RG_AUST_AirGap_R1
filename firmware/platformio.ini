[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
src_dir = src_camera
build_flags =
    -D CAMERA_MAIN
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:wokwi]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -D WOKWI_SIM
lib_deps = bblanchon/ArduinoJson@^7.0.0
